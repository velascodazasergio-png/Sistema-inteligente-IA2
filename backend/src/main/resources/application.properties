spring.application.name=incident-ai-system
server.port=8080

# ==========================================================
# CONFIGURACION DE BASE DE DATOS (H2 en memoria en modo PostgreSQL)
# ==========================================================
# Por defecto H2 en memoria. Con Docker Compose se usa PostgreSQL mediante variables de entorno.
spring.datasource.url=${DB_URL:jdbc:h2:mem:incidents_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Consola visual de H2 en: http://localhost:8080/h2-console
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ==========================================================
# JPA / HIBERNATE E INICIALIZACION DE DATA.SQL
# ==========================================================
# update crea las tablas primero; defer-datasource-initialization=true ejecuta data.sql despues de crear las tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${DB_INIT_MODE:always}
# En una base persistente (PostgreSQL) data.sql ya cargado falla por claves duplicadas al reiniciar: se ignora.
spring.sql.init.continue-on-error=${DB_INIT_CONTINUE_ON_ERROR:false}
# data.sql reinicia los contadores de id (RESTART WITH) en cada arranque. En PostgreSQL se añade
# sequences-postgres.sql, que los vuelve a poner por encima del MAX(id) real tras un reinicio.
spring.sql.init.data-locations=${DB_INIT_DATA_LOCATIONS:classpath:data.sql}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# SWAGGER / OPENAPI (springdoc)
# ==========================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ==========================================================
# INTEGRACION N8N (URL del Webhook y Timeouts en milisegundos)
# ==========================================================
n8n.webhook.assistance-url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/analyze-incident}
n8n.webhook.connect-timeout-ms=5000
n8n.webhook.read-timeout-ms=15000

# Autenticacion del webhook de n8n (credencial "Header Auth"). Vacio = no se envia encabezado.
n8n.webhook.auth-header-name=${N8N_WEBHOOK_AUTH_HEADER:X-N8N-Token}
n8n.webhook.auth-header-value=${N8N_WEBHOOK_AUTH_VALUE:}

# ==========================================================
# SEGURIDAD DE CALLBACKS Y CORS
# ==========================================================
# Token que n8n debe enviar en el encabezado X-Callback-Token al llamar a
# /ai-assistance/responses y /ai-assistance/queries/{id}/failure. Vacio = sin verificacion (desarrollo).
app.callback.token=${CALLBACK_TOKEN:}

# Origenes del frontend permitidos (separados por coma, admite comodines de puerto)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
