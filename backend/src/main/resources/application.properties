spring.application.name=incident-ai-system
server.port=8080

# ==========================================================
# CONFIGURACION DE BASE DE DATOS (H2 en memoria en modo PostgreSQL)
# ==========================================================
spring.datasource.url=jdbc:h2:mem:incidents_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola visual de H2 en: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================================
# JPA / HIBERNATE E INICIALIZACION DE DATA.SQL
# ==========================================================
# update crea las tablas primero; defer-datasource-initialization=true ejecuta data.sql despues de crear las tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# SWAGGER / OPENAPI (springdoc)
# ==========================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ==========================================================
# INTEGRACION N8N (URL del Webhook y Timeouts en milisegundos)
# ==========================================================
n8n.webhook.assistance-url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/analyze-incident}
n8n.webhook.connect-timeout-ms=5000
n8n.webhook.read-timeout-ms=15000

# Autenticacion del webhook de n8n (credencial "Header Auth"). Vacio = no se envia encabezado.
n8n.webhook.auth-header-name=${N8N_WEBHOOK_AUTH_HEADER:X-N8N-Token}
n8n.webhook.auth-header-value=${N8N_WEBHOOK_AUTH_VALUE:}

# ==========================================================
# SEGURIDAD DE CALLBACKS Y CORS
# ==========================================================
# Token que n8n debe enviar en el encabezado X-Callback-Token al llamar a
# /ai-assistance/responses y /ai-assistance/queries/{id}/failure. Vacio = sin verificacion (desarrollo).
app.callback.token=${CALLBACK_TOKEN:}

# Origenes del frontend permitidos (separados por coma, admite comodines de puerto)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
