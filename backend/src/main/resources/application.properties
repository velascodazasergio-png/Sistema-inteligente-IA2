spring.application.name=incident-ai-system
server.port=8081
# Run from IntelliJ: read the project .env (working dir = repo root or backend/). Optional, ignored in Docker.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
# Behind the nginx proxy: honor X-Forwarded-Proto/Host to build https links (Swagger, redirects)
server.forward-headers-strategy=framework

# ==========================================================
# DATABASE CONFIGURATION (in-memory H2 in PostgreSQL mode)
# ==========================================================
# In-memory H2 by default. Docker Compose switches to PostgreSQL through environment variables.
spring.datasource.url=${DB_URL:jdbc:h2:mem:incidents_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 web console at: http://localhost:8080/h2-console
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ==========================================================
# JPA / HIBERNATE AND DATA.SQL INITIALIZATION
# ==========================================================
# update creates the tables first; defer-datasource-initialization=true runs data.sql after the tables exist
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${DB_INIT_MODE:always}
# On a persistent database (PostgreSQL) an already loaded data.sql fails with duplicate keys on restart: ignored.
spring.sql.init.continue-on-error=${DB_INIT_CONTINUE_ON_ERROR:false}
# data.sql resets the ID counters (RESTART WITH) on every startup. On PostgreSQL, sequences-postgres.sql
# is added to move them back above the real MAX(id) after a restart.
spring.sql.init.data-locations=${DB_INIT_DATA_LOCATIONS:classpath:data.sql}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# SWAGGER / OPENAPI (springdoc)
# ==========================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ==========================================================
# N8N INTEGRATION (webhook URL and timeouts in milliseconds)
# ==========================================================
n8n.webhook.assistance-url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/analyze-incident}
# Webhook of workflow 01: editing, verifying or (de)activating an article reindexes it in Qdrant.
# Empty = disabled (the workflow can be run by hand with {"all": true}).
n8n.webhook.index-url=${N8N_INDEX_WEBHOOK_URL:}
n8n.webhook.connect-timeout-ms=5000
n8n.webhook.read-timeout-ms=15000

# Authentication of the n8n webhook ("Header Auth" credential). Empty = no header is sent.
n8n.webhook.auth-header-name=${N8N_WEBHOOK_AUTH_HEADER:X-N8N-Token}
n8n.webhook.auth-header-value=${N8N_WEBHOOK_AUTH_VALUE:}

# ==========================================================
# CALLBACK SECURITY AND CORS
# ==========================================================
# Token that n8n must send in the X-Callback-Token header when calling
# /ai-assistance/responses and /ai-assistance/queries/{id}/failure. Empty = no check (development).
app.callback.token=${CALLBACK_TOKEN:}

# Allowed frontend origins (comma-separated, port wildcards allowed)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# ==========================================================
# AUTHENTICATION (JWT) AND ROLES
# ==========================================================
# HS256 key used to sign the tokens (at least 32 characters). Empty = random key on every startup
# (sessions are lost when the backend restarts). In Docker it comes from JWT_SECRET in .env.
app.jwt.secret=${JWT_SECRET:}
# Session length in minutes (8 hours = one working day)
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
# Password assigned on startup to the users that do not have one yet (the data.sql users).
# Empty = none is assigned. Change it in .env outside a demo environment.
app.security.demo-password=${DEMO_PASSWORD:Soporte2026*}
