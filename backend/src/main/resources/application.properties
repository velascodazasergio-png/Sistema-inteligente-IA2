spring.application.name=incident-ai-system
server.port=8080

# ==========================================================
# CONFIGURACION DE BASE DE DATOS (H2 en memoria para desarrollo)
# ==========================================================
spring.datasource.url=jdbc:h2:mem:incidents_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola visual de H2 en: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================================
# JPA / HIBERNATE
# ==========================================================
# update crea/actualiza las tablas en ingles automaticamente a partir de las @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# SWAGGER / OPENAPI (springdoc)
# ==========================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ==========================================================
# INTEGRACION N8N (URL del Webhook y Timeouts en milisegundos)
# ==========================================================
n8n.webhook.assistance-url=http://localhost:5678/webhook/analyze-incident
n8n.webhook.connect-timeout-ms=5000
n8n.webhook.read-timeout-ms=15000
