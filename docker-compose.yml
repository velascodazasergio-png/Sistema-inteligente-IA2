# Entorno completo: PostgreSQL, backend Spring Boot, frontend estático, n8n y Qdrant.
# Uso: cp .env.example .env  (y completar las claves)  →  docker compose up -d --build
name: incidentes-ia

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incidents_db}
      POSTGRES_USER: ${POSTGRES_USER:-incidents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Solo accesible desde este equipo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-incidents_db}
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: ${POSTGRES_USER:-incidents}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_INIT_CONTINUE_ON_ERROR: "true"
      DB_INIT_DATA_LOCATIONS: classpath:data.sql,classpath:sequences-postgres.sql
      H2_CONSOLE_ENABLED: "false"
      SHOW_SQL: "false"
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/analyze-incident
      N8N_INDEX_WEBHOOK_URL: http://n8n:5678/webhook/index-knowledge-base
      N8N_WEBHOOK_AUTH_HEADER: ${N8N_WEBHOOK_AUTH_HEADER:-X-N8N-Token}
      N8N_WEBHOOK_AUTH_VALUE: ${N8N_WEBHOOK_AUTH_VALUE:-}
      CALLBACK_TOKEN: ${CALLBACK_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/categories > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5500}:80"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    healthcheck:
      # La imagen no trae curl ni wget: se consulta /readyz con bash
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\r\n\r\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:1.80.0
    depends_on:
      qdrant:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      GENERIC_TIMEZONE: ${TZ:-America/Bogota}
      TZ: ${TZ:-America/Bogota}
      # Los flujos leen su configuración con $env.*
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      SPRING_BASE_URL: http://backend:8080
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-knowledge_articles}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      LLM_MODEL: ${LLM_MODEL}
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-0.75}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      MIN_CHARS_DESCRIPCION: ${MIN_CHARS_DESCRIPCION:-20}
      CALLBACK_TOKEN: ${CALLBACK_TOKEN:-}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    healthcheck:
      # 127.0.0.1 y no localhost: en la imagen localhost resuelve a IPv6 y n8n escucha en IPv4
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  qdrant-data:
  n8n-data:
