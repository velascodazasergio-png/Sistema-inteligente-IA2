# Entorno completo: PostgreSQL, backend Spring Boot, frontend estático, n8n y Qdrant.
# Uso: cp .env.example .env  (y completar las claves)  →  docker compose up -d --build
name: incidentes-ia

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incidents_db}
      POSTGRES_USER: ${POSTGRES_USER:-incidents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-incidents_db}
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: ${POSTGRES_USER:-incidents}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_INIT_CONTINUE_ON_ERROR: "true"
      H2_CONSOLE_ENABLED: "false"
      SHOW_SQL: "false"
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/analyze-incident
      N8N_WEBHOOK_AUTH_HEADER: ${N8N_WEBHOOK_AUTH_HEADER:-X-N8N-Token}
      N8N_WEBHOOK_AUTH_VALUE: ${N8N_WEBHOOK_AUTH_VALUE:-}
      CALLBACK_TOKEN: ${CALLBACK_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "8080:8080"

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "5500:80"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"

  n8n:
    image: n8nio/n8n:1.80.0
    depends_on:
      - qdrant
      - backend
    environment:
      GENERIC_TIMEZONE: ${TZ:-America/Bogota}
      TZ: ${TZ:-America/Bogota}
      # Los flujos leen su configuración con $env.*
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      SPRING_BASE_URL: http://backend:8080
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-knowledge_articles}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      LLM_MODEL: ${LLM_MODEL}
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-0.75}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      MIN_CHARS_DESCRIPCION: ${MIN_CHARS_DESCRIPCION:-20}
      CALLBACK_TOKEN: ${CALLBACK_TOKEN:-}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "5678:5678"

volumes:
  postgres-data:
  qdrant-data:
  n8n-data:
