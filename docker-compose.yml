# Full environment: PostgreSQL, Spring Boot backend, static frontend, n8n and Qdrant.
# Usage: cp .env.example .env  (and fill in the keys)  →  docker compose up -d --build
name: incidentes-ia

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incidents_db}
      POSTGRES_USER: ${POSTGRES_USER:-incidents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Only reachable from this machine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-incidents_db}
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: ${POSTGRES_USER:-incidents}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_INIT_CONTINUE_ON_ERROR: "true"
      DB_INIT_DATA_LOCATIONS: classpath:data.sql,classpath:sequences-postgres.sql
      H2_CONSOLE_ENABLED: "false"
      SHOW_SQL: "false"
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/analyze-incident
      N8N_INDEX_WEBHOOK_URL: http://n8n:5678/webhook/index-knowledge-base
      N8N_WEBHOOK_AUTH_HEADER: ${N8N_WEBHOOK_AUTH_HEADER:-X-N8N-Token}
      N8N_WEBHOOK_AUTH_VALUE: ${N8N_WEBHOOK_AUTH_VALUE:-}
      CALLBACK_TOKEN: ${CALLBACK_TOKEN:-}
      # JWT sessions: signing key, session length and initial password of the data.sql users
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Soporte2026*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api-docs > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Creates a self-signed certificate for localhost the first time (if ./certs does not have one).
  # With a real certificate, copy fullchain.pem and privkey.pem into ./certs and this step does nothing.
  certs:
    image: alpine:3.20
    volumes:
      - ./certs:/certs
    command:
      - sh
      - -c
      - |
        if [ -s /certs/fullchain.pem ] && [ -s /certs/privkey.pem ]; then echo "Certificado existente"; exit 0; fi
        apk add --no-cache openssl > /dev/null
        openssl req -x509 -nodes -newkey rsa:2048 -days 825 -subj "/CN=localhost"           -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"           -keyout /certs/privkey.pem -out /certs/fullchain.pem
        chmod 644 /certs/fullchain.pem && chmod 600 /certs/privkey.pem
        echo "Certificado autofirmado creado en ./certs"

  frontend:
    image: nginx:1.27-alpine
    depends_on:
      certs:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy/app.conf:/etc/nginx/snippets/app.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5500}:80"
      - "127.0.0.1:${FRONTEND_HTTPS_PORT:-5443}:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    healthcheck:
      # The image has neither curl nor wget: /readyz is queried with bash
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\r\n\r\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:1.80.0
    # Before "n8n start", n8n/setup.sh creates the credentials from the .env values, imports the combined
    # workflow and activates it: n8n is ready on any machine, with no manual steps.
    # tr removes the \r that Git leaves on Windows (core.autocrlf), which would break the script.
    entrypoint: ["tini", "--", "/bin/sh", "-c"]
    command: ["tr -d '\\r' < /setup.sh > /tmp/setup.sh && sh /tmp/setup.sh && exec /docker-entrypoint.sh"]
    depends_on:
      qdrant:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      GENERIC_TIMEZONE: ${TZ:-America/Bogota}
      TZ: ${TZ:-America/Bogota}
      # The workflows read their configuration through $env.*
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      SPRING_BASE_URL: http://backend:8080
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-knowledge_articles}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-0.55}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      MIN_CHARS_DESCRIPCION: ${MIN_CHARS_DESCRIPCION:-20}
      CALLBACK_TOKEN: ${CALLBACK_TOKEN:-}
      # For n8n/setup.sh: webhook credential (the same one the backend sends)
      N8N_AUTO_SETUP: ${N8N_AUTO_SETUP:-true}
      N8N_WEBHOOK_AUTH_HEADER: ${N8N_WEBHOOK_AUTH_HEADER:-X-N8N-Token}
      N8N_WEBHOOK_AUTH_VALUE: ${N8N_WEBHOOK_AUTH_VALUE:-}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./n8n/setup.sh:/setup.sh:ro
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    healthcheck:
      # 127.0.0.1 and not localhost: in the image localhost resolves to IPv6 and n8n listens on IPv4
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  qdrant-data:
  n8n-data:
