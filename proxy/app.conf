# Routes and headers shared by HTTP and HTTPS (included from default.conf)
root  /usr/share/nginx/html;
index index.html;
client_max_body_size 1m;
server_tokens off;

# Security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# API, OpenAPI docs and Swagger UI → Spring Boot backend
location ~ ^/(api|api-docs|swagger-ui|v3/api-docs)(/|\.html|$) {
    # Backend running from IntelliJ on the host (port 8081)
    proxy_pass         http://host.docker.internal:8081;
    proxy_http_version 1.1;
    proxy_set_header   Host              $http_host;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $http_host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
}

# Static frontend
location / {
    try_files $uri $uri/ /index.html;
}
