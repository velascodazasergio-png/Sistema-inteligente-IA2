# Frontend nginx: serves the page over HTTP (port 80) and HTTPS (port 443).
# In both cases /api, /api-docs and /swagger-ui are forwarded to the backend, so the page
# uses the API from its own origin (no CORS and no HTTPS → HTTP mixed content).

server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/app.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificate: the "certs" service creates a self-signed one if the ./certs folder is empty.
    # For a real one (e.g. Let's Encrypt), copy fullchain.pem and privkey.pem into ./certs.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # The browser always uses HTTPS for this site for one year
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/app.conf;
}
