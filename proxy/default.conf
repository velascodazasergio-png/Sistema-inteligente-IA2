# nginx del frontend: sirve la página por HTTP (puerto 80) y por HTTPS (puerto 443).
# En los dos casos /api, /api-docs y /swagger-ui se reenvían al backend, así la página
# usa la API desde su mismo origen (sin CORS ni contenido mixto HTTPS → HTTP).

server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/app.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificado: el servicio "certs" crea uno autofirmado si la carpeta ./certs está vacía.
    # Para uno real (p. ej. Let's Encrypt) copia fullchain.pem y privkey.pem en ./certs.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # El navegador usa siempre HTTPS para este sitio durante un año
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/app.conf;
}
